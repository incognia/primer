<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reproductor que reescribe sus clases</title>
<!--
  Página de prueba de la autoprueba (--selftest). Igual que player.html, pero al detectar la pantalla
  completa reescribe las clases de los contenedores y deja al padre con opacity 0, para comprobar que
  el script compartido mantiene el modo. NO es Prime Video: simula un comportamiento que sí se vio en
  DAZN y que en Prime Video está sin verificar.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header, footer { padding: 12px 16px; background: #222; }
  .layout { display: flex; gap: 12px; padding: 12px; }
  aside { width: 160px; background: #1a1a1a; padding: 12px; }
  main { flex: 1; }
  .shell { width: 100%; }
  #player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #543; }
  #player video { position: absolute; inset: 0; width: 100%; height: 100%; background: #432; }
  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px; background: rgba(0,0,0,.5); }
  button { padding: 6px 12px; }
</style>
</head>
<body>
<header id="top">Cabecera de la página</header>
<div class="layout">
  <aside id="side">Menú lateral</aside>
  <main id="main">
    <div class="shell" id="shell">
      <div id="player" class="player">
        <video id="v" muted playsinline></video>
        <div id="controls"><button id="fs" type="button">Pantalla completa</button></div>
      </div>
    </div>
    <p id="status">sin pantalla completa</p>
  </main>
</div>
<footer id="bottom">Pie de la página</footer>

<script>
(() => {
  const player = document.getElementById('player');
  const status = document.getElementById('status');
  let rewrites = 0;

  // Como un framework que redibuja: pisa className de los contenedores y oculta al padre
  function rewrite() {
    for (let el = player; el && el !== document.body; el = el.parentElement) {
      el.className = 'redrawn-' + rewrites;
    }
    document.getElementById('shell').style.opacity = '0';
    rewrites++;
  }

  document.getElementById('fs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen(); else player.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      status.textContent = 'en pantalla completa: ' + document.fullscreenElement.id;
      rewrite();                 // de inmediato
      setTimeout(rewrite, 30);   // y otra vez después, como un segundo renderizado
      setTimeout(rewrite, 120);
    } else {
      status.textContent = 'sin pantalla completa';
    }
  });

  window.__fixture = {
    name: 'rewrites-classes',
    target: () => player,
    request: () => player.requestFullscreen(),
    exit: () => document.exitFullscreen(),
    fullscreenId: () => document.fullscreenElement ? document.fullscreenElement.id : null,
    rect: () => { const r = player.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; },
    viewport: () => ({ w: innerWidth, h: innerHeight }),
    styleAttr: () => player.getAttribute('style'),
    rewrites: () => rewrites,
    // Cuántos ancestros siguen visibles según su estilo calculado
    ancestorsVisible: () => { for (let el = player; el && el !== document.body; el = el.parentElement) { if (getComputedStyle(el).opacity === '0') return false; } return true; }
  };
  console.log('fixture-ready:rewrites-classes');
})();
</script>
</body>
</html>
