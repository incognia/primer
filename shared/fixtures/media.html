  // Intenta reproducir sin acción del usuario; si el motor no lo permite no es un fallo de la página
  media().forEach(m => { const r = m.play(); if (r && r.catch) r.catch(() => {}); });
  const api = {
    media,
    mutedStates: () => media().map(m => m.muted),
    allMuted: () => media().every(m => m.muted),
    noneMuted: () => media().every(m => !m.muted),
    muteAll: () => media().forEach(m => { m.muted = true; }),
    unmuteAll: () => media().forEach(m => { m.muted = false; }),
    playing: () => media().map(m => !m.paused)
  };
  window.__fixture = Object.assign({ name: 'media' }, api);
  console.log('fixture-ready:media');
})();
</script>
